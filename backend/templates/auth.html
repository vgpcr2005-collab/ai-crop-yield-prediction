<!-- Login & Register Modal -->
<div id="authModal" class="auth-modal active">
    <div class="auth-container">
        <div class="auth-header">
            <h1>
                🌾 AgriAI
                  @VGPCR 
            </h1>
            <p>Smart Agricultural Decision System</p>
        </div>

        <!-- Tab Navigation -->
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchAuthTab('login')">Login</button>
            <button class="auth-tab" onclick="switchAuthTab('register')">Register</button>
        </div>

        <!-- Login Tab -->
        <div id="loginTab" class="auth-tab-content active">
            <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label>📧 Gmail Address</label>
                        <input type="email" id="loginEmail" placeholder="you@gmail.com" required>
                </div>

                <button type="button" class="btn btn-primary full-width" onclick="sendEmailCode()">
                    Send Email Code
                </button>

                <div id="emailCodeSection" class="hidden">
                    <div class="divider">Verification Email Sent</div>
                    
                    <div class="form-group">
                        <label>🔐 Enter Verification Code</label>
                        <input type="text" id="loginEmailCode" placeholder="000000" maxlength="6" required>
                    </div>

                    <button type="button" class="btn btn-primary full-width" onclick="verifyEmailCode()">
                        Verify & Login
                    </button>

                    <button type="button" class="btn btn-secondary full-width" onclick="resetEmailCode()">
                        Send New Code
                    </button>
                </div>
            </form>
        </div>

        <!-- Register Tab -->
        <div id="registerTab" class="auth-tab-content">
            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label>👤 Full Name</label>
                    <input type="text" id="regName" placeholder="Your Name" required>
                </div>

                <div class="form-group">
                    <label>📧 Email Address</label>
                    <input type="email" id="regEmail" placeholder="your@email.com" required>
                </div>

                <button type="button" class="btn btn-primary full-width" onclick="registerUser()">
                    Register & Verify Email
                </button>

                <p class="auth-info">
                    A free verification code will be sent to your email address
                </p>
            </form>
        </div>

        <!-- Error Message -->
        <div id="authError" class="auth-error hidden"></div>
    </div>
</div>

<!-- Location Auto-Fetch Section -->
<div id="locationSection" class="location-section hidden">
    <div class="location-container">
        <h3>📍 Select Your Location</h3>
        <p>Auto-fetch weather and parameters for your area</p>

        <div class="form-group">
            <label>Choose Location</label>
            <select id="locationSelect" onchange="fetchLocationParameters()">
                <option value="">-- Select Location --</option>
            </select>
        </div>

        <button class="btn btn-primary" onclick="loadLocationData()">Load Location Data</button>
        <button class="btn btn-secondary" onclick="skipLocationSetup()">Skip for Now</button>
    </div>
</div>
